name: CI
on: [push, pull_request, workflow_dispatch]
env:
  FRONTEND_PATH: ${{ github.workspace }}/frontend
  BACKEND_PATH: ${{ github.workspace }}/backend
  FLASK_APP: ${{ github.workspace }}/backend/app/main.py
  FLASK_ENV: local
  PYTHONPATH: ${{ github.workspace }}/backend
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12.8]
        node-version: [22.12.0]
        uv-version: [0.8.5]
    steps:
      - uses: actions/checkout@v3

      - name: "Configure VM for Elasticsearch"
        run: |
          sudo swapoff -a
          sudo sysctl -w vm.swappiness=1
          sudo sysctl -w fs.file-max=262144
          sudo sysctl -w vm.max_map_count=262144

      - name: "Start Elasticsearch and PostgreSQL"
        run: docker compose up -d db es

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: "Install uv ${{ matrix.uv-version }}"
        uses: astral-sh/setup-uv@v6
        with:
          version: "${{ matrix.uv-version }}"
          enable-cache: true
          cache-suffix: "${{ hashFiles('uv.lock') }}"

      - name: Setup virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv sync

      - name: "Set up Node ${{ matrix.node-version }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

#      - name: "Install Apache"
#        run: |
#          sudo apt update
#          sudo apt-get -y install apache2 apache2-utils apache2-dev

      - name: Create config files
        run: |
          cd $BACKEND_PATH
          cp config/template.env .env
          echo "GOOGLE_MAPS_API_KEY = ${{secrets.GOOGLE_MAPS_API_KEY}}" >> .env
          echo "GOOGLE_ANALYTICS_API_KEY = ${{secrets.GOOGLE_ANALYTICS_API_KEY}}" >> .env
          echo "GOOGLE_TAG_MANAGER_ID = ${{secrets.GOOGLE_TAG_MANAGER_ID}}" >> .env
          echo "MASTER_EMAIL = ${{secrets.MASTER_EMAIL}}" >> .env
          echo "MASTER_PASS = ${{secrets.MASTER_PASS}}" >> .env
          
          mkdir -p instance
          cp config/ci.py instance/instance_config.py
          cp config/testing.py instance/testing.py

      - name: Initialize database and search index
        run: |
          cd $BACKEND_PATH
          echo "FLASK_APP=$FLASK_APP"
          pwd
          ls -al .

          echo -e '\n\n*** Running Alembic database migrations... ***\n\n'
          
          uv run flask clear-db
          uv run flask upgrade-db
          uv run flask init-db

          echo -e '\n\n*** Updating Elasticsearch index... ***\n\n'
          uv run flask init-index
      - name: Run backend unit tests
        run: |
          cd $BACKEND_PATH
          pwd
          ls -al .
          
          echo -e '\n\n*** Running backend unit tests... ***\n\n'
          echo "ENV_NAME=testing"
          uv run coverage run -m unittest discover -s tests -t tests

      - name: Install frontend dependencies
        run: |
          cd $FRONTEND_PATH
          npm install

      - name: Run frontend unit tests
        run: |
          cd $FRONTEND_PATH
          ng test

      - name: Export coverage report to XML
        shell: bash
        run: |
          cd $BACKEND_PATH
          pwd
          ls -al .
          coverage xml
          ls -al .

      # Hack to rewrite paths in coverage support so SonarCloud can parse them properly.
      - name: Rewrite coverage source path for SonarCloud
        shell: bash
        run: |
          sed -i \
          's/<source>\/home\/runner\/work\/autismdrive\/autismdrive/<source>\/github\/workspace/g' \
          /home/runner/work/autismdrive/autismdrive/backend/coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.SONARCLOUD_GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
