sonar.projectKey=autismdrive_autismdrive
sonar.organization=autismdrive

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=./backend/app,./frontend/src
sonar.python.tests=./backend/tests
sonar.python.coverage.reportPaths=./backend/coverage.xml
sonar.python.version=3.12
sonar.exclusions=**/node_modules/**,**/*.cy.ts,**/*.spec.ts
sonar.test.inclusions=**/*.cy.ts,**/*.spec.ts
sonar.javascript.lcov.reportPaths=./frontend/coverage/lcov.info
