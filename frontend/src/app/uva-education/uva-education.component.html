<div id="hero" class="gradient-overlay container">
  <div class="hero-content">
    <h1>Webinars</h1>
  </div>
</div>
<app-loading *ngIf="newsItems() === undefined"></app-loading>
<div *ngIf="newsItems()">
  <div class="container uva-education">
    <div *ngIf="newsItems().length > 0" class="row" fxFlex="87%">
      <app-news-item *ngFor="let item of newsItems(); let i = index" [item]="item" [index]="i"></app-news-item>
    </div>
    <div class="pad-2" *ngIf="!newsItems() || newsItems().length === 0">
      <h4>Please check back for UVA Education content coming soon.</h4>
    </div>
  </div>
</div>
