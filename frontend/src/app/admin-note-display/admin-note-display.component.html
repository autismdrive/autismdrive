@if (currentUser?.role === 'admin') {
  <div id="admin_notes">
    <mat-card>
      <mat-card-title>Admin Notes</mat-card-title>
      <mat-card-content>
        @if (notes()?.length > 0) {
          @for (adminNote of notes(); track adminNote.id) {
            <div fxLayout="row" fxLayoutAlign="space-between">
              <div fxFlex="70%">
                <p mat-line>
                  <a [routerLink]="['admin','user',`${adminNote.user_id}`]" style="font-weight: bold"
                    >User #{{ adminNote.user_id }} - {{ adminNote.user.email }}</a
                  >
                  <em> - last updated: {{ adminNote.last_updated | date: 'short' }}</em>
                </p>
                <p mat-line>{{ adminNote.note }}</p>
              </div>
              <div fxFlex="20%">
                <button
                  mat-mini-fab
                  type="button"
                  color="primary"
                  (click)="openDialog(adminNote)"
                  matTooltip="Edit Note"
                  ><mat-icon>edit</mat-icon></button
                >
                <button
                  mat-mini-fab
                  type="button"
                  color="accent"
                  (click)="deleteNote(adminNote)"
                  matTooltip="Delete Note"
                  ><mat-icon>close</mat-icon></button
                >
              </div>
            </div>
          }
        }
        <button mat-flat-button color="primary" type="button" (click)="openDialog()">Add Note</button>
      </mat-card-content>
    </mat-card>
  </div>
}
