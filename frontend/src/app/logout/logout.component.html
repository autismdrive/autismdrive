<div
  class="container mat-typography"
  fxLayout.gt-md="row wrap"
  fxLayout.lt-lg="column"
  fxLayoutGap="10px"
  fxLayoutAlign="center center"
  id="logout-message"
>
  <div fxFlex.gt-md="50%" fxFlex.lt-lg="80%" class="message">
    <app-logo variant="dark-lg" [routerLink]="['/home']"></app-logo>
    <h1>You have been logged out.</h1>
    <button id="ok-button" mat-flat-button [routerLink]="['/home']" color="primary">Ok</button>
  </div>
</div>
