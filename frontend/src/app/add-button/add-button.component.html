<div *ngIf="currentUser && currentUser.permissions.includes('create_resource') || currentUser.permissions.includes('create_study')">
  <button
    mat-mini-fab
    color="primary"
    matTooltip="{{ addLabel }}"
    [routerLink]="addLink"
    aria-label="Add"
    class="add-button"
  >
    <mat-icon>add</mat-icon>
  </button>
</div>
